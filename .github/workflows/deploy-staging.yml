# =============================================================================
# NeuroReach AI — Deploy to Staging
#
# Triggers:
#   1. workflow_call — Called from Promote workflow (primary mechanism)
#   2. push to staging — Direct push fallback (e.g., hotfix)
#   3. workflow_dispatch — Manual trigger from Actions tab
# =============================================================================
name: Deploy to Staging

on:
  push:
    branches: [ staging ]
  workflow_dispatch: # Called as a reusable workflow from promote.yml

  workflow_call:

concurrency:
  group: deploy-staging
  cancel-in-progress: false

env:
  AWS_REGION: us-east-2
  ECR_REGISTRY: 131880217305.dkr.ecr.us-east-2.amazonaws.com
  ECR_REPOSITORY: neuroreach-ai/backend
  ECR_REPOSITORY_FRONTEND: neuroreach-ai/frontend
  ECS_CLUSTER: neuroreach-ai-cluster
  ECS_SERVICE_BACKEND: neuroreach-staging-backend-service
  ECS_SERVICE_CELERY: neuroreach-staging-celery-service
  ECS_SERVICE_FRONTEND: neuroreach-staging-frontend-service
  TASK_DEF_BACKEND: neuroreach-staging-backend
  TASK_DEF_CELERY: neuroreach-staging-celery
  TASK_DEF_FRONTEND: neuroreach-staging-frontend
  CONTAINER_NAME_BACKEND: backend
  CONTAINER_NAME_CELERY: celery-worker
  CONTAINER_NAME_FRONTEND: frontend
  STAGING_URL: https://app-staging.tmsinstitute.co
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"

permissions:
  id-token: write
  contents: read

jobs:
  # ===========================================================================
  # Build, Push, and Deploy to Staging
  # ===========================================================================
  build-and-deploy:
    name: "🚀 Build & Deploy to Staging"
    runs-on: ubuntu-latest
    environment: staging
    outputs:
      deploy_sha: ${{ steps.deploy-info.outputs.sha_short }}
      image_tag: ${{ steps.image-tag.outputs.tag }}
    steps:
      # Always checkout the staging branch explicitly.
      # This ensures correct code is deployed regardless of trigger type
      # (push, workflow_dispatch, or workflow_call from promote).
      - uses: actions/checkout@v4
        with:
          ref: staging

      # ---------------------------------------------------------------------
      # REPO IDENTITY GUARD — prevents cross-contamination between tools.
      # Fails fast (before any ECR push) if the checked-out tree isn't
      # NeuroReach. Root cause of 2026-04-20 incident was a tree from the
      # other tool being deployed to NeuroReach AWS resources.
      # ---------------------------------------------------------------------
      - name: "🔐 Verify repo identity (NeuroReach)"
        run: |
          chmod +x scripts/verify_repo_identity.sh
          ./scripts/verify_repo_identity.sh

      # Determine the ACTUAL commit SHA being deployed (from the checked-out branch)
      - name: Get deployment info
        id: deploy-info
        run: |
          DEPLOY_SHA=$(git rev-parse HEAD)
          DEPLOY_SHA_SHORT=$(echo $DEPLOY_SHA | cut -c1-7)
          echo "sha=$DEPLOY_SHA" >> $GITHUB_OUTPUT
          echo "sha_short=$DEPLOY_SHA_SHORT" >> $GITHUB_OUTPUT
          echo "📦 Deploying staging from commit: $DEPLOY_SHA_SHORT"
          echo "   Full SHA: $DEPLOY_SHA"

      # --- AWS Authentication ---
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # --- Build Frontend ---
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend bundles
        run: |
          cd frontend
          npm ci
          npm run build
          npm run build:widget
          npm run build:assessment
        env:
          VITE_API_URL: ${{ env.STAGING_URL }}

      - name: Copy frontend bundles to backend
        run: |
          mkdir -p backend/frontend-bundles/dist
          mkdir -p backend/frontend-bundles/dist-widget
          mkdir -p backend/frontend-bundles/dist-assessment
          cp -r frontend/dist/* backend/frontend-bundles/dist/ 2>/dev/null || true
          cp -r frontend/dist-widget/* backend/frontend-bundles/dist-widget/ 2>/dev/null || true
          cp -r frontend/dist-assessment/* backend/frontend-bundles/dist-assessment/ 2>/dev/null || true

      # --- Copy Database Migration SQL Files into Docker context ---
      - name: Copy migration SQL files into backend context
        run: |
          mkdir -p backend/migrations
          cp database/init/*.sql backend/migrations/ 2>/dev/null || true
          echo "📁 Migration files copied:"
          ls -la backend/migrations/*.sql 2>/dev/null | wc -l
          echo " SQL files ready for Docker build"

      # --- Build & Push Docker Image ---
      - name: Set image tag
        id: image-tag
        run: |
          SHA=${{ steps.deploy-info.outputs.sha_short }}
          echo "tag=staging-${SHA}" >> $GITHUB_OUTPUT
          echo "full_image=${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:staging-${SHA}" >> $GITHUB_OUTPUT

      - name: Build Docker image
        run: |
          docker build \
            --target production \
            --tag ${{ steps.image-tag.outputs.full_image }} \
            --tag ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:staging-latest \
            --label "git.sha=${{ steps.deploy-info.outputs.sha }}" \
            --label "git.branch=staging" \
            --label "build.timestamp=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --file backend/Dockerfile \
            backend/

      # --- Security Scan ---
      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          image-ref: ${{ steps.image-tag.outputs.full_image }}
          severity: CRITICAL,HIGH
          exit-code: 0
          format: table
        continue-on-error: true

      # --- Push to ECR ---
      - name: Push Docker image to ECR
        run: |
          docker push ${{ steps.image-tag.outputs.full_image }}
          docker push ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:staging-latest
          echo "✅ Pushed: ${{ steps.image-tag.outputs.full_image }}"

      # =====================================================================
      # DATABASE MIGRATIONS — Run BEFORE deploying new backend code.
      # Uses the freshly-pushed Docker image (which contains the migration
      # SQL files in /app/migrations/) as a one-off ECS task with a command
      # override. The run_migrations.py script tracks applied files in a
      # `schema_migrations` table, so this is safe to run on every deploy.
      # =====================================================================
      - name: "🗃️ Run database migrations"
        run: |
          echo "🗃️  Running database migrations via ECS one-off task..."

          # Step 1: Register a NEW task definition revision with the freshly-pushed image.
          # The current task def still references the OLD image (no run_migrations.py).
          aws ecs describe-task-definition \
            --task-definition ${{ env.TASK_DEF_BACKEND }} \
            --query 'taskDefinition' \
            --output json > migration-task-def.json

          python3 -c "
          import json
          with open('migration-task-def.json') as f:
              td = json.load(f)
          for key in ['taskDefinitionArn','revision','status','requiresAttributes','compatibilities','registeredAt','registeredBy']:
              td.pop(key, None)
          for c in td['containerDefinitions']:
              if c['name'] == '${{ env.CONTAINER_NAME_BACKEND }}':
                  c['image'] = '${{ steps.image-tag.outputs.full_image }}'
          with open('migration-task-def.json','w') as f:
              json.dump(td, f, indent=2)
          "

          MIGRATION_TD_ARN=$(aws ecs register-task-definition \
            --cli-input-json file://migration-task-def.json \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)
          echo "  Registered migration task def: $MIGRATION_TD_ARN"

          # Step 2: Get networking config from the existing backend service
          NETWORK_CONFIG=$(aws ecs describe-services \
            --cluster ${{ env.ECS_CLUSTER }} \
            --services ${{ env.ECS_SERVICE_BACKEND }} \
            --query 'services[0].networkConfiguration' \
            --output json)

          # Step 3: Run migration task with the NEW image
          TASK_ARN=$(aws ecs run-task \
            --cluster ${{ env.ECS_CLUSTER }} \
            --task-definition "$MIGRATION_TD_ARN" \
            --launch-type FARGATE \
            --network-configuration "$NETWORK_CONFIG" \
            --overrides '{
              "containerOverrides": [{
                "name": "${{ env.CONTAINER_NAME_BACKEND }}",
                "command": ["python", "/app/scripts/run_migrations.py"]
              }]
            }' \
            --query 'tasks[0].taskArn' \
            --output text)

          echo "  Migration task started: $TASK_ARN"
          TASK_ID=$(echo "$TASK_ARN" | awk -F'/' '{print $NF}')

          # Wait for the migration task to complete (max 5 minutes)
          echo "  Waiting for migration task to complete..."
          for i in $(seq 1 30); do
            STATUS=$(aws ecs describe-tasks \
              --cluster ${{ env.ECS_CLUSTER }} \
              --tasks "$TASK_ID" \
              --query 'tasks[0].lastStatus' \
              --output text 2>/dev/null || echo "UNKNOWN")

            if [ "$STATUS" = "STOPPED" ]; then
              EXIT_CODE=$(aws ecs describe-tasks \
                --cluster ${{ env.ECS_CLUSTER }} \
                --tasks "$TASK_ID" \
                --query 'tasks[0].containers[0].exitCode' \
                --output text)
              REASON=$(aws ecs describe-tasks \
                --cluster ${{ env.ECS_CLUSTER }} \
                --tasks "$TASK_ID" \
                --query 'tasks[0].stoppedReason' \
                --output text)

              if [ "$EXIT_CODE" = "0" ]; then
                echo "  ✅ Migrations completed successfully (exit code 0)"
                break
              else
                echo "  ❌ Migration task FAILED (exit code: $EXIT_CODE)"
                echo "  Reason: $REASON"
                exit 1
              fi
            fi

            echo "    ⏳ Status: $STATUS (attempt $i/30)"
            sleep 10
          done

          # Check if we timed out
          if [ "$STATUS" != "STOPPED" ]; then
            echo "  ❌ Migration task timed out (status: $STATUS)"
            exit 1
          fi

      # --- Deploy Backend Service ---
      - name: Download current staging backend task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition ${{ env.TASK_DEF_BACKEND }} \
            --query 'taskDefinition' \
            --output json > staging-backend-task-def.json
          python3 -c "
          import json
          with open('staging-backend-task-def.json') as f:
              td = json.load(f)
          for key in ['taskDefinitionArn','revision','status','requiresAttributes','compatibilities','registeredAt','registeredBy']:
              td.pop(key, None)
          with open('staging-backend-task-def.json','w') as f:
              json.dump(td, f, indent=2)
          "

      - name: Update staging backend task definition with new image
        id: backend-task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: staging-backend-task-def.json
          container-name: ${{ env.CONTAINER_NAME_BACKEND }}
          image: ${{ steps.image-tag.outputs.full_image }}

      - name: Deploy staging backend to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.backend-task-def.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE_BACKEND }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true
          wait-for-minutes: 15

      # --- Deploy Celery Service ---
      - name: Download current staging celery task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition ${{ env.TASK_DEF_CELERY }} \
            --query 'taskDefinition' \
            --output json > staging-celery-task-def.json
          python3 -c "
          import json
          with open('staging-celery-task-def.json') as f:
              td = json.load(f)
          for key in ['taskDefinitionArn','revision','status','requiresAttributes','compatibilities','registeredAt','registeredBy']:
              td.pop(key, None)
          with open('staging-celery-task-def.json','w') as f:
              json.dump(td, f, indent=2)
          "

      - name: Update staging celery task definition with new image
        id: celery-task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: staging-celery-task-def.json
          container-name: ${{ env.CONTAINER_NAME_CELERY }}
          image: ${{ steps.image-tag.outputs.full_image }}

      - name: Deploy staging celery to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.celery-task-def.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE_CELERY }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true
          wait-for-minutes: 15

      # --- Build & Deploy Frontend Service (nginx + React SPA) ---
      - name: Set frontend image tag
        id: frontend-image-tag
        run: |
          SHA=${{ steps.deploy-info.outputs.sha_short }}
          echo "tag=staging-${SHA}" >> $GITHUB_OUTPUT
          echo "full_image=${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY_FRONTEND }}:staging-${SHA}" >> $GITHUB_OUTPUT

      - name: Build frontend Docker image
        run: |
          docker build \
            --target production \
            --tag ${{ steps.frontend-image-tag.outputs.full_image }} \
            --tag ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY_FRONTEND }}:staging-latest \
            --label "git.sha=${{ steps.deploy-info.outputs.sha }}" \
            --label "git.branch=staging" \
            --label "build.timestamp=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --label "environment=staging" \
            --file frontend/Dockerfile \
            frontend/

      - name: Push frontend Docker image to ECR
        run: |
          docker push ${{ steps.frontend-image-tag.outputs.full_image }}
          docker push ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY_FRONTEND }}:staging-latest
          echo "✅ Pushed frontend: ${{ steps.frontend-image-tag.outputs.full_image }}"

      - name: Download current staging frontend task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition ${{ env.TASK_DEF_FRONTEND }} \
            --query 'taskDefinition' \
            --output json > staging-frontend-task-def.json
          python3 -c "
          import json
          with open('staging-frontend-task-def.json') as f:
              td = json.load(f)
          for key in ['taskDefinitionArn','revision','status','requiresAttributes','compatibilities','registeredAt','registeredBy']:
              td.pop(key, None)
          with open('staging-frontend-task-def.json','w') as f:
              json.dump(td, f, indent=2)
          "

      - name: Update staging frontend task definition with new image
        id: frontend-task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: staging-frontend-task-def.json
          container-name: ${{ env.CONTAINER_NAME_FRONTEND }}
          image: ${{ steps.frontend-image-tag.outputs.full_image }}

      - name: Deploy staging frontend to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.frontend-task-def.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE_FRONTEND }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true
          wait-for-minutes: 20

      # --- Smoke Tests ---
      - name: Run staging smoke tests
        run: |
          echo "🔥 Running smoke tests against staging..."
          sleep 15

          # ALB DNS for direct access (bypasses external DNS dependency)
          ALB_DNS="neuroreach-ai-alb-1879069977.us-east-2.elb.amazonaws.com"

          # Test via ALB directly with Host header (always works, no DNS dependency)
          echo "📡 Testing via ALB direct (Host header routing)..."
          HEALTH_STATUS=$(curl -sk https://${ALB_DNS}/health/live -H "Host: app-staging.tmsinstitute.co" 2>&1) || {
            echo "❌ Staging liveness check failed via ALB!"
            echo "Response: $HEALTH_STATUS"
            exit 1
          }
          echo "✅ Liveness (ALB direct): $HEALTH_STATUS"

          HEALTH_RESPONSE=$(curl -sk https://${ALB_DNS}/health -H "Host: app-staging.tmsinstitute.co" 2>&1) || {
            echo "❌ Staging health check failed via ALB!"
            echo "Response: $HEALTH_RESPONSE"
            exit 1
          }
          echo "✅ Health (ALB direct): $HEALTH_RESPONSE"

          # Also test via custom domain if DNS is configured (non-blocking)
          echo ""
          echo "📡 Testing via custom domain (non-blocking)..."
          DOMAIN_STATUS=$(curl -sf ${{ env.STAGING_URL }}/health/live 2>&1) && {
            echo "✅ Custom domain reachable: $DOMAIN_STATUS"
          } || {
            echo "⚠️  Custom domain not yet reachable (DNS CNAME may not be configured)"
            echo "   Configure CNAME: app-staging.tmsinstitute.co → ${ALB_DNS}"
          }

          echo ""
          echo "🎉 All staging smoke tests passed!"

      # --- Deployment Summary ---

      # ---------------------------------------------------------------------
      # POST-DEPLOY IDENTITY VERIFICATION
      # Curl the live frontend and assert <title> contains "NeuroReach".
      # If the nginx container is serving the wrong tool, this step fails
      # and the deploy is marked red.
      # ---------------------------------------------------------------------
      - name: "🔐 Post-deploy: verify live frontend <title> is NeuroReach"
        run: |
          URL="${{ env.STAGING_URL }}"
          echo "🔎 Fetching $URL and checking <title>..."
          for i in 1 2 3 4 5 6; do
            HTML=$(curl -s --max-time 10 "$URL/" || true)
            TITLE=$(echo "$HTML" | grep -oiE '<title>[^<]*</title>' | head -n1 || echo '')
            if echo "$TITLE" | grep -iq 'NeuroReach'; then
              echo "✅ Live frontend title OK: $TITLE"
              if echo "$HTML" | grep -iq 'SleepReach\|sleeplessinarizona'; then
                echo "❌ CRITICAL: live HTML contains forbidden markers!"
                echo "$HTML" | grep -iE 'SleepReach\|sleeplessinarizona' | head -5
                exit 1
              fi
              echo "✅ No cross-contamination markers in live HTML."
              exit 0
            fi
            echo "⏳ Attempt $i/6: title was '$TITLE' — waiting 10s for ALB to cut over..."
            sleep 10
          done
          echo "❌ CRITICAL: $URL is NOT serving NeuroReach — contamination detected."
          echo "   Last title seen: $TITLE"
          echo "   First 500 bytes of HTML:"
          echo "$HTML" | head -c 500
          exit 1
      - name: Deployment summary
        if: always()
        run: |
          echo "## 🚀 Staging Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Detail | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| **Environment** | Staging |" >> $GITHUB_STEP_SUMMARY
          echo "| **URL** | ${{ env.STAGING_URL }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Image** | \`${{ steps.image-tag.outputs.tag }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Commit** | \`${{ steps.deploy-info.outputs.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Branch** | staging |" >> $GITHUB_STEP_SUMMARY
          echo "| **Actor** | ${{ github.actor }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Cluster** | ${{ env.ECS_CLUSTER }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Backend Service** | ${{ env.ECS_SERVICE_BACKEND }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Celery Service** | ${{ env.ECS_SERVICE_CELERY }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Frontend Service** | ${{ env.ECS_SERVICE_FRONTEND }} |" >> $GITHUB_STEP_SUMMARY

  # ===========================================================================
  # Notify
  # ===========================================================================
  notify:
    name: "📧 Notify"
    runs-on: ubuntu-latest
    needs: [ build-and-deploy ]
    if: always()
    steps:
      - name: Notify on success
        if: needs.build-and-deploy.result == 'success'
        run: |
          echo "✅ Staging deployment successful!"
          echo "URL: https://app-staging.tmsinstitute.co"
          echo "Image: ${{ needs.build-and-deploy.outputs.image_tag }}"
          echo "Commit: ${{ needs.build-and-deploy.outputs.deploy_sha }}"
          echo "Deployed by: ${{ github.actor }}"

      - name: Notify on failure
        if: needs.build-and-deploy.result == 'failure'
        run: |
          echo "❌ Staging deployment FAILED!"
          echo "Commit: ${{ needs.build-and-deploy.outputs.deploy_sha }}"
          echo "Actor: ${{ github.actor }}"
          echo "Check logs: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
