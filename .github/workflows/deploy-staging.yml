# =============================================================================
# NeuroReach AI — Deploy to Staging
# Triggers on push to `staging` branch
# =============================================================================
name: Deploy to Staging

on:
  # DISABLED: Staging deploy is disabled until Phase 9 creates staging infrastructure
  # push:
  #   branches: [staging]
  # Manual trigger only — enable push trigger after Phase 9 staging setup
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: false  # Don't cancel in-progress deployments

env:
  AWS_REGION: us-east-2
  ECR_REGISTRY: 131880217305.dkr.ecr.us-east-2.amazonaws.com
  ECR_REPOSITORY: neuroreach-ai/backend
  ECS_CLUSTER: neuroreach-ai-cluster
  ECS_SERVICE_BACKEND: neuroreach-ai-backend-service
  ECS_SERVICE_CELERY: neuroreach-ai-celery-service
  TASK_DEF_BACKEND: neuroreach-ai-backend
  TASK_DEF_CELERY: neuroreach-ai-celery
  CONTAINER_NAME_BACKEND: backend
  CONTAINER_NAME_CELERY: celery-worker
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"

permissions:
  id-token: write
  contents: read

jobs:
  # ===========================================================================
  # Run CI checks first
  # ===========================================================================
  ci:
    name: "🔍 CI Checks"
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  # ===========================================================================
  # Build, Push, and Deploy
  # ===========================================================================
  build-and-deploy:
    name: "🚀 Build & Deploy to Staging"
    runs-on: ubuntu-latest
    needs: [ci]
    environment: staging
    steps:
      - uses: actions/checkout@v4

      # --- AWS Authentication ---
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # --- Build Frontend ---
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend bundles
        run: |
          cd frontend
          npm ci
          npm run build
          npm run build:widget
          npm run build:assessment
        env:
          VITE_API_URL: "https://api.tmsinstitute.co"

      - name: Copy frontend bundles to backend
        run: |
          mkdir -p backend/frontend-bundles/dist
          mkdir -p backend/frontend-bundles/dist-widget
          mkdir -p backend/frontend-bundles/dist-assessment
          cp -r frontend/dist/* backend/frontend-bundles/dist/ 2>/dev/null || true
          cp -r frontend/dist-widget/* backend/frontend-bundles/dist-widget/ 2>/dev/null || true
          cp -r frontend/dist-assessment/* backend/frontend-bundles/dist-assessment/ 2>/dev/null || true

      # --- Build & Push Docker Image ---
      - name: Set image tag
        id: image-tag
        run: |
          SHA=$(echo ${{ github.sha }} | cut -c1-7)
          echo "tag=staging-${SHA}" >> $GITHUB_OUTPUT
          echo "full_image=${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:staging-${SHA}" >> $GITHUB_OUTPUT

      - name: Build Docker image
        run: |
          docker build \
            --target production \
            --tag ${{ steps.image-tag.outputs.full_image }} \
            --tag ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:staging-latest \
            --label "git.sha=${{ github.sha }}" \
            --label "git.branch=staging" \
            --label "build.timestamp=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --file backend/Dockerfile \
            backend/

      # --- Security Scan Docker Image ---
      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: ${{ steps.image-tag.outputs.full_image }}
          severity: CRITICAL,HIGH
          exit-code: 0  # Non-blocking for staging
          format: table
        continue-on-error: true

      # --- Push to ECR ---
      - name: Push Docker image to ECR
        run: |
          docker push ${{ steps.image-tag.outputs.full_image }}
          docker push ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:staging-latest
          echo "✅ Pushed: ${{ steps.image-tag.outputs.full_image }}"

      # --- Deploy Backend Service ---
      - name: Download current backend task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition ${{ env.TASK_DEF_BACKEND }} \
            --query 'taskDefinition' \
            --output json > backend-task-def.json
          # Remove fields that can't be re-registered
          python3 -c "
          import json
          with open('backend-task-def.json') as f:
              td = json.load(f)
          for key in ['taskDefinitionArn','revision','status','requiresAttributes','compatibilities','registeredAt','registeredBy']:
              td.pop(key, None)
          with open('backend-task-def.json','w') as f:
              json.dump(td, f, indent=2)
          "

      - name: Update backend task definition with new image
        id: backend-task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: backend-task-def.json
          container-name: ${{ env.CONTAINER_NAME_BACKEND }}
          image: ${{ steps.image-tag.outputs.full_image }}

      - name: Deploy backend to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.backend-task-def.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE_BACKEND }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true
          wait-for-minutes: 10

      # --- Deploy Celery Service ---
      - name: Download current celery task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition ${{ env.TASK_DEF_CELERY }} \
            --query 'taskDefinition' \
            --output json > celery-task-def.json
          python3 -c "
          import json
          with open('celery-task-def.json') as f:
              td = json.load(f)
          for key in ['taskDefinitionArn','revision','status','requiresAttributes','compatibilities','registeredAt','registeredBy']:
              td.pop(key, None)
          with open('celery-task-def.json','w') as f:
              json.dump(td, f, indent=2)
          "

      - name: Update celery task definition with new image
        id: celery-task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: celery-task-def.json
          container-name: ${{ env.CONTAINER_NAME_CELERY }}
          image: ${{ steps.image-tag.outputs.full_image }}

      - name: Deploy celery to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.celery-task-def.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE_CELERY }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true
          wait-for-minutes: 10

      # --- Smoke Tests ---
      - name: Run smoke tests
        run: |
          echo "🔥 Running smoke tests against staging..."
          
          # Wait a moment for service to stabilize
          sleep 15
          
          # Test liveness endpoint
          HEALTH_STATUS=$(curl -sf https://api.tmsinstitute.co/health/live 2>&1) || {
            echo "❌ Liveness check failed!"
            echo "Response: $HEALTH_STATUS"
            exit 1
          }
          echo "✅ Liveness: $HEALTH_STATUS"
          
          # Test health endpoint
          HEALTH_RESPONSE=$(curl -sf https://api.tmsinstitute.co/health 2>&1) || {
            echo "❌ Health check failed!"
            exit 1
          }
          echo "✅ Health: $HEALTH_RESPONSE"
          
          echo "🎉 All smoke tests passed!"

      # --- Deployment Summary ---
      - name: Deployment summary
        if: always()
        run: |
          echo "## 🚀 Staging Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Detail | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| **Image** | \`${{ steps.image-tag.outputs.tag }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Commit** | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Branch** | staging |" >> $GITHUB_STEP_SUMMARY
          echo "| **Actor** | ${{ github.actor }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Cluster** | ${{ env.ECS_CLUSTER }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Backend Service** | ${{ env.ECS_SERVICE_BACKEND }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Celery Service** | ${{ env.ECS_SERVICE_CELERY }} |" >> $GITHUB_STEP_SUMMARY

  # ===========================================================================
  # Notify
  # ===========================================================================
  notify:
    name: "📧 Notify"
    runs-on: ubuntu-latest
    needs: [build-and-deploy]
    if: always()
    steps:
      - name: Notify on success
        if: needs.build-and-deploy.result == 'success'
        run: |
          echo "✅ Staging deployment successful!"
          echo "Image: staging-$(echo ${{ github.sha }} | cut -c1-7)"
          echo "Deployed by: ${{ github.actor }}"
          # Email notification via GitHub Actions built-in (commit status)
          # For external email: integrate SendGrid/SES action here

      - name: Notify on failure
        if: needs.build-and-deploy.result == 'failure'
        run: |
          echo "❌ Staging deployment FAILED!"
          echo "Commit: ${{ github.sha }}"
          echo "Actor: ${{ github.actor }}"
          echo "Check logs: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
