# =============================================================================
# NeuroReach AI — Deploy to Staging
# Triggers on push to `staging` branch or manual dispatch
# =============================================================================
name: Deploy to Staging

on:
  push:
    branches: [staging]
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: false

env:
  AWS_REGION: us-east-2
  ECR_REGISTRY: 131880217305.dkr.ecr.us-east-2.amazonaws.com
  ECR_REPOSITORY: neuroreach-ai/backend
  ECS_CLUSTER: neuroreach-ai-cluster
  ECS_SERVICE_BACKEND: neuroreach-staging-backend-service
  ECS_SERVICE_CELERY: neuroreach-staging-celery-service
  TASK_DEF_BACKEND: neuroreach-staging-backend
  TASK_DEF_CELERY: neuroreach-staging-celery
  CONTAINER_NAME_BACKEND: backend
  CONTAINER_NAME_CELERY: celery-worker
  STAGING_URL: https://app-staging.tmsinstitute.co
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"

permissions:
  id-token: write
  contents: read

jobs:
  # ===========================================================================
  # Build, Push, and Deploy to Staging
  # ===========================================================================
  build-and-deploy:
    name: "🚀 Build & Deploy to Staging"
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4

      # --- AWS Authentication ---
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # --- Build Frontend ---
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend bundles
        run: |
          cd frontend
          npm ci
          npm run build
          npm run build:widget
          npm run build:assessment
        env:
          VITE_API_URL: ${{ env.STAGING_URL }}

      - name: Copy frontend bundles to backend
        run: |
          mkdir -p backend/frontend-bundles/dist
          mkdir -p backend/frontend-bundles/dist-widget
          mkdir -p backend/frontend-bundles/dist-assessment
          cp -r frontend/dist/* backend/frontend-bundles/dist/ 2>/dev/null || true
          cp -r frontend/dist-widget/* backend/frontend-bundles/dist-widget/ 2>/dev/null || true
          cp -r frontend/dist-assessment/* backend/frontend-bundles/dist-assessment/ 2>/dev/null || true

      # --- Build & Push Docker Image ---
      - name: Set image tag
        id: image-tag
        run: |
          SHA=$(echo ${{ github.sha }} | cut -c1-7)
          echo "tag=staging-${SHA}" >> $GITHUB_OUTPUT
          echo "full_image=${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:staging-${SHA}" >> $GITHUB_OUTPUT

      - name: Build Docker image
        run: |
          docker build \
            --target production \
            --tag ${{ steps.image-tag.outputs.full_image }} \
            --tag ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:staging-latest \
            --label "git.sha=${{ github.sha }}" \
            --label "git.branch=staging" \
            --label "build.timestamp=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --file backend/Dockerfile \
            backend/

      # --- Security Scan ---
      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: ${{ steps.image-tag.outputs.full_image }}
          severity: CRITICAL,HIGH
          exit-code: 0
          format: table
        continue-on-error: true

      # --- Push to ECR ---
      - name: Push Docker image to ECR
        run: |
          docker push ${{ steps.image-tag.outputs.full_image }}
          docker push ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:staging-latest
          echo "✅ Pushed: ${{ steps.image-tag.outputs.full_image }}"

      # --- Deploy Backend Service ---
      - name: Download current staging backend task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition ${{ env.TASK_DEF_BACKEND }} \
            --query 'taskDefinition' \
            --output json > staging-backend-task-def.json
          python3 -c "
          import json
          with open('staging-backend-task-def.json') as f:
              td = json.load(f)
          for key in ['taskDefinitionArn','revision','status','requiresAttributes','compatibilities','registeredAt','registeredBy']:
              td.pop(key, None)
          with open('staging-backend-task-def.json','w') as f:
              json.dump(td, f, indent=2)
          "

      - name: Update staging backend task definition with new image
        id: backend-task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: staging-backend-task-def.json
          container-name: ${{ env.CONTAINER_NAME_BACKEND }}
          image: ${{ steps.image-tag.outputs.full_image }}

      - name: Deploy staging backend to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.backend-task-def.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE_BACKEND }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true
          wait-for-minutes: 10

      # --- Deploy Celery Service ---
      - name: Download current staging celery task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition ${{ env.TASK_DEF_CELERY }} \
            --query 'taskDefinition' \
            --output json > staging-celery-task-def.json
          python3 -c "
          import json
          with open('staging-celery-task-def.json') as f:
              td = json.load(f)
          for key in ['taskDefinitionArn','revision','status','requiresAttributes','compatibilities','registeredAt','registeredBy']:
              td.pop(key, None)
          with open('staging-celery-task-def.json','w') as f:
              json.dump(td, f, indent=2)
          "

      - name: Update staging celery task definition with new image
        id: celery-task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: staging-celery-task-def.json
          container-name: ${{ env.CONTAINER_NAME_CELERY }}
          image: ${{ steps.image-tag.outputs.full_image }}

      - name: Deploy staging celery to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.celery-task-def.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE_CELERY }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true
          wait-for-minutes: 10

      # --- Smoke Tests ---
      - name: Run staging smoke tests
        run: |
          echo "🔥 Running smoke tests against staging..."
          sleep 15
          
          # ALB DNS for direct access (bypasses external DNS dependency)
          ALB_DNS="neuroreach-ai-alb-1879069977.us-east-2.elb.amazonaws.com"
          
          # Test via ALB directly with Host header (always works, no DNS dependency)
          echo "📡 Testing via ALB direct (Host header routing)..."
          HEALTH_STATUS=$(curl -sk https://${ALB_DNS}/health/live -H "Host: app-staging.tmsinstitute.co" 2>&1) || {
            echo "❌ Staging liveness check failed via ALB!"
            echo "Response: $HEALTH_STATUS"
            exit 1
          }
          echo "✅ Liveness (ALB direct): $HEALTH_STATUS"
          
          HEALTH_RESPONSE=$(curl -sk https://${ALB_DNS}/health -H "Host: app-staging.tmsinstitute.co" 2>&1) || {
            echo "❌ Staging health check failed via ALB!"
            echo "Response: $HEALTH_RESPONSE"
            exit 1
          }
          echo "✅ Health (ALB direct): $HEALTH_RESPONSE"
          
          # Also test via custom domain if DNS is configured (non-blocking)
          echo ""
          echo "📡 Testing via custom domain (non-blocking)..."
          DOMAIN_STATUS=$(curl -sf ${{ env.STAGING_URL }}/health/live 2>&1) && {
            echo "✅ Custom domain reachable: $DOMAIN_STATUS"
          } || {
            echo "⚠️  Custom domain not yet reachable (DNS CNAME may not be configured)"
            echo "   Configure CNAME: app-staging.tmsinstitute.co → ${ALB_DNS}"
          }
          
          echo ""
          echo "🎉 All staging smoke tests passed!"

      # --- Deployment Summary ---
      - name: Deployment summary
        if: always()
        run: |
          echo "## 🚀 Staging Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Detail | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| **Environment** | Staging |" >> $GITHUB_STEP_SUMMARY
          echo "| **URL** | ${{ env.STAGING_URL }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Image** | \`${{ steps.image-tag.outputs.tag }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Commit** | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Branch** | ${{ github.ref_name }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Actor** | ${{ github.actor }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Cluster** | ${{ env.ECS_CLUSTER }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Backend Service** | ${{ env.ECS_SERVICE_BACKEND }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Celery Service** | ${{ env.ECS_SERVICE_CELERY }} |" >> $GITHUB_STEP_SUMMARY

  # ===========================================================================
  # Notify
  # ===========================================================================
  notify:
    name: "📧 Notify"
    runs-on: ubuntu-latest
    needs: [build-and-deploy]
    if: always()
    steps:
      - name: Notify on success
        if: needs.build-and-deploy.result == 'success'
        run: |
          echo "✅ Staging deployment successful!"
          echo "URL: https://app-staging.tmsinstitute.co"
          echo "Image: staging-$(echo ${{ github.sha }} | cut -c1-7)"
          echo "Deployed by: ${{ github.actor }}"

      - name: Notify on failure
        if: needs.build-and-deploy.result == 'failure'
        run: |
          echo "❌ Staging deployment FAILED!"
          echo "Commit: ${{ github.sha }}"
          echo "Actor: ${{ github.actor }}"
          echo "Check logs: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
