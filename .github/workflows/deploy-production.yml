# =============================================================================
# NeuroReach AI — Deploy to Production
#
# Triggers:
#   1. workflow_call — Called from Promote workflow (primary mechanism)
#      Accepts skip_ci input since CI already passed in the promote pipeline.
#   2. push to main — Direct push fallback (runs CI first)
#   3. workflow_dispatch — Manual trigger from Actions tab (runs CI first)
# =============================================================================
name: Deploy to Production

on:
  push:
    branches: [ main ]
  workflow_dispatch:
  workflow_call:
    inputs:
      skip_ci:
        description: "Skip CI checks (CI already passed in caller)"
        type: boolean
        default: false

concurrency:
  group: deploy-production
  cancel-in-progress: false # NEVER cancel in-progress production deployments

env:
  AWS_REGION: us-east-2
  ECR_REGISTRY: 131880217305.dkr.ecr.us-east-2.amazonaws.com
  ECR_REPOSITORY: neuroreach-ai/backend
  ECR_REPOSITORY_FRONTEND: neuroreach-ai/frontend
  ECS_CLUSTER: neuroreach-ai-cluster
  ECS_SERVICE_BACKEND: neuroreach-ai-backend-service
  ECS_SERVICE_CELERY: neuroreach-ai-celery-service
  ECS_SERVICE_FRONTEND: neuroreach-ai-frontend-service
  TASK_DEF_BACKEND: neuroreach-ai-backend
  TASK_DEF_CELERY: neuroreach-ai-celery
  TASK_DEF_FRONTEND: neuroreach-ai-frontend
  CONTAINER_NAME_BACKEND: backend
  CONTAINER_NAME_CELERY: celery-worker
  CONTAINER_NAME_FRONTEND: frontend
  PRODUCTION_URL: https://app.tmsinstitute.co
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"

permissions:
  id-token: write
  contents: write # Needed for git tagging

jobs:
  # ===========================================================================
  # Run CI checks first (skipped when called from Promote — CI already passed)
  # ===========================================================================
  ci:
    name: "🔍 CI Checks"
    if: ${{ !(inputs.skip_ci || false) }}
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  # ===========================================================================
  # Build, Push, and Deploy
  # ===========================================================================
  build-and-deploy:
    name: "🚀 Build & Deploy to Production"
    runs-on: ubuntu-latest
    needs: [ ci ]
    if: ${{ always() && (needs.ci.result == 'success' || needs.ci.result ==
      'skipped') }}
    environment: production
    outputs:
      deploy_sha: ${{ steps.deploy-info.outputs.sha_short }}
      deploy_sha_full: ${{ steps.deploy-info.outputs.sha }}
      image_tag: ${{ steps.image-tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0 # Full history for tagging

      # ---------------------------------------------------------------------
      # REPO IDENTITY GUARD
      # ---------------------------------------------------------------------
      - name: "🔐 Verify repo identity (NeuroReach)"
        run: |
          chmod +x scripts/verify_repo_identity.sh
          ./scripts/verify_repo_identity.sh

      - name: Get deployment info
        id: deploy-info
        run: |
          DEPLOY_SHA=$(git rev-parse HEAD)
          DEPLOY_SHA_SHORT=$(echo $DEPLOY_SHA | cut -c1-7)
          echo "sha=$DEPLOY_SHA" >> $GITHUB_OUTPUT
          echo "sha_short=$DEPLOY_SHA_SHORT" >> $GITHUB_OUTPUT
          echo "🚀 Deploying PRODUCTION from commit: $DEPLOY_SHA_SHORT"
          echo "   Full SHA: $DEPLOY_SHA"

      # --- AWS Authentication ---
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # --- Build Frontend ---
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend bundles
        run: |
          cd frontend
          npm ci
          npm run build
          npm run build:widget
          npm run build:assessment
        env:
          VITE_API_URL: ${{ env.PRODUCTION_URL }}

      - name: Copy frontend bundles to backend
        run: |
          mkdir -p backend/frontend-bundles/dist
          mkdir -p backend/frontend-bundles/dist-widget
          mkdir -p backend/frontend-bundles/dist-assessment
          cp -r frontend/dist/* backend/frontend-bundles/dist/ 2>/dev/null || true
          cp -r frontend/dist-widget/* backend/frontend-bundles/dist-widget/ 2>/dev/null || true
          cp -r frontend/dist-assessment/* backend/frontend-bundles/dist-assessment/ 2>/dev/null || true

      # --- Copy Database Migration SQL Files into Docker context ---
      - name: Copy migration SQL files into backend context
        run: |
          mkdir -p backend/migrations
          cp database/init/*.sql backend/migrations/ 2>/dev/null || true
          MIGRATION_COUNT=$(ls backend/migrations/*.sql 2>/dev/null | wc -l)
          echo "📁 $MIGRATION_COUNT migration SQL files copied into Docker context"

      # --- Build & Push Backend Docker Image ---
      - name: Set image tag
        id: image-tag
        run: |
          SHA=${{ steps.deploy-info.outputs.sha_short }}
          echo "tag=prod-${SHA}" >> $GITHUB_OUTPUT
          echo "full_image=${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:prod-${SHA}" >> $GITHUB_OUTPUT

      - name: Build Docker image
        run: |
          docker build \
            --target production \
            --tag ${{ steps.image-tag.outputs.full_image }} \
            --tag ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:prod-latest \
            --tag ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:latest \
            --label "git.sha=${{ steps.deploy-info.outputs.sha }}" \
            --label "git.branch=main" \
            --label "build.timestamp=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --label "environment=production" \
            --file backend/Dockerfile \
            backend/

      # --- Security Scan ---
      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          image-ref: ${{ steps.image-tag.outputs.full_image }}
          severity: CRITICAL
          exit-code: 0
          format: table
        continue-on-error: true

      # --- Push to ECR ---
      - name: Push Docker image to ECR
        run: |
          docker push ${{ steps.image-tag.outputs.full_image }}
          docker push ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:prod-latest
          docker push ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:latest
          echo "✅ Pushed: ${{ steps.image-tag.outputs.full_image }}"

      # =====================================================================
      # DATABASE MIGRATIONS — Run BEFORE deploying new backend code.
      # Uses the freshly-pushed Docker image (which contains migration SQL
      # files in /app/migrations/) as a one-off ECS task with a command
      # override. The run_migrations.py script tracks applied files in a
      # `schema_migrations` table, so this is safe to run on every deploy.
      # =====================================================================
      - name: "🗃️ Run database migrations"
        run: |
          echo "🗃️  Running PRODUCTION database migrations via ECS one-off task..."

          # Get networking config from the existing backend service
          NETWORK_CONFIG=$(aws ecs describe-services \
            --cluster ${{ env.ECS_CLUSTER }} \
            --services ${{ env.ECS_SERVICE_BACKEND }} \
            --query 'services[0].networkConfiguration' \
            --output json)
          echo "Network config: $NETWORK_CONFIG"

          # Run migration task using the existing task definition (has DB creds)
          TASK_ARN=$(aws ecs run-task \
            --cluster ${{ env.ECS_CLUSTER }} \
            --task-definition ${{ env.TASK_DEF_BACKEND }} \
            --launch-type FARGATE \
            --network-configuration "$NETWORK_CONFIG" \
            --overrides '{
              "containerOverrides": [{
                "name": "${{ env.CONTAINER_NAME_BACKEND }}",
                "command": ["python", "/app/scripts/run_migrations.py"]
              }]
            }' \
            --query 'tasks[0].taskArn' \
            --output text)

          echo "  Migration task started: $TASK_ARN"
          TASK_ID=$(echo "$TASK_ARN" | awk -F'/' '{print $NF}')

          # Wait for the migration task to complete (max 5 minutes)
          echo "  Waiting for migration task to complete..."
          for i in $(seq 1 30); do
            STATUS=$(aws ecs describe-tasks \
              --cluster ${{ env.ECS_CLUSTER }} \
              --tasks "$TASK_ID" \
              --query 'tasks[0].lastStatus' \
              --output text 2>/dev/null || echo "UNKNOWN")

            if [ "$STATUS" = "STOPPED" ]; then
              EXIT_CODE=$(aws ecs describe-tasks \
                --cluster ${{ env.ECS_CLUSTER }} \
                --tasks "$TASK_ID" \
                --query 'tasks[0].containers[0].exitCode' \
                --output text)
              REASON=$(aws ecs describe-tasks \
                --cluster ${{ env.ECS_CLUSTER }} \
                --tasks "$TASK_ID" \
                --query 'tasks[0].stoppedReason' \
                --output text)

              if [ "$EXIT_CODE" = "0" ]; then
                echo "  ✅ Migrations completed successfully (exit code 0)"
                break
              else
                echo "  ❌ CRITICAL: Migration task FAILED (exit code: $EXIT_CODE)"
                echo "  Reason: $REASON"
                echo "  ⛔ Aborting production deployment — DB schema not ready."
                exit 1
              fi
            fi

            echo "    ⏳ Status: $STATUS (attempt $i/30)"
            sleep 10
          done

          if [ "$STATUS" != "STOPPED" ]; then
            echo "  ❌ Migration task timed out (status: $STATUS)"
            exit 1
          fi

      # --- Deploy Backend Service ---
      - name: Download current backend task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition ${{ env.TASK_DEF_BACKEND }} \
            --query 'taskDefinition' \
            --output json > backend-task-def.json
          python3 -c "
          import json
          with open('backend-task-def.json') as f:
              td = json.load(f)
          for key in ['taskDefinitionArn','revision','status','requiresAttributes','compatibilities','registeredAt','registeredBy']:
              td.pop(key, None)
          with open('backend-task-def.json','w') as f:
              json.dump(td, f, indent=2)
          "

      - name: Update backend task definition with new image
        id: backend-task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: backend-task-def.json
          container-name: ${{ env.CONTAINER_NAME_BACKEND }}
          image: ${{ steps.image-tag.outputs.full_image }}

      - name: Deploy backend to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.backend-task-def.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE_BACKEND }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true
          wait-for-minutes: 15

      # --- Deploy Celery Service ---
      - name: Download current celery task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition ${{ env.TASK_DEF_CELERY }} \
            --query 'taskDefinition' \
            --output json > celery-task-def.json
          python3 -c "
          import json
          with open('celery-task-def.json') as f:
              td = json.load(f)
          for key in ['taskDefinitionArn','revision','status','requiresAttributes','compatibilities','registeredAt','registeredBy']:
              td.pop(key, None)
          with open('celery-task-def.json','w') as f:
              json.dump(td, f, indent=2)
          "

      - name: Update celery task definition with new image
        id: celery-task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: celery-task-def.json
          container-name: ${{ env.CONTAINER_NAME_CELERY }}
          image: ${{ steps.image-tag.outputs.full_image }}

      - name: Deploy celery to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.celery-task-def.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE_CELERY }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true
          wait-for-minutes: 15

      # ---------------------------------------------------------------------
      # CRITICAL: Enforce Celery desiredCount = 1
      # The worker command uses `celery ... worker -B` (embedded Beat).
      # Running >1 replica = duplicate scheduled tasks (emails/SMS).
      # ---------------------------------------------------------------------
      - name: Enforce celery desiredCount=1 (prevent duplicate Beat)
        run: |
          echo "🔒 Pinning ${{ env.ECS_SERVICE_CELERY }} to desiredCount=1..."
          aws ecs update-service \
            --cluster ${{ env.ECS_CLUSTER }} \
            --service ${{ env.ECS_SERVICE_CELERY }} \
            --desired-count 1 \
            --query 'service.{svc:serviceName,desired:desiredCount,running:runningCount}' \
            --output json
          echo "✅ Celery service pinned to 1 replica."

      # --- Build & Deploy Frontend Service (nginx + React SPA) ---
      - name: Set frontend image tag
        id: frontend-image-tag
        run: |
          SHA=${{ steps.deploy-info.outputs.sha_short }}
          echo "tag=prod-${SHA}" >> $GITHUB_OUTPUT
          echo "full_image=${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY_FRONTEND }}:prod-${SHA}" >> $GITHUB_OUTPUT

      - name: Build frontend Docker image
        run: |
          docker build \
            --target production \
            --tag ${{ steps.frontend-image-tag.outputs.full_image }} \
            --tag ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY_FRONTEND }}:prod-latest \
            --tag ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY_FRONTEND }}:latest \
            --label "git.sha=${{ steps.deploy-info.outputs.sha }}" \
            --label "git.branch=main" \
            --label "build.timestamp=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --label "environment=production" \
            --file frontend/Dockerfile \
            frontend/

      - name: Push frontend Docker image to ECR
        run: |
          docker push ${{ steps.frontend-image-tag.outputs.full_image }}
          docker push ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY_FRONTEND }}:prod-latest
          docker push ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY_FRONTEND }}:latest
          echo "✅ Pushed frontend: ${{ steps.frontend-image-tag.outputs.full_image }}"

      - name: Download current frontend task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition ${{ env.TASK_DEF_FRONTEND }} \
            --query 'taskDefinition' \
            --output json > frontend-task-def.json
          python3 -c "
          import json
          with open('frontend-task-def.json') as f:
              td = json.load(f)
          for key in ['taskDefinitionArn','revision','status','requiresAttributes','compatibilities','registeredAt','registeredBy']:
              td.pop(key, None)
          with open('frontend-task-def.json','w') as f:
              json.dump(td, f, indent=2)
          "

      - name: Update frontend task definition with new image
        id: frontend-task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: frontend-task-def.json
          container-name: ${{ env.CONTAINER_NAME_FRONTEND }}
          image: ${{ steps.frontend-image-tag.outputs.full_image }}

      - name: Deploy frontend to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.frontend-task-def.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE_FRONTEND }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true
          wait-for-minutes: 15

      # --- Smoke Tests ---
      - name: Run production smoke tests
        run: |
          echo "🔥 Running smoke tests against production..."
          sleep 20

          ALB_DNS="neuroreach-ai-alb-1879069977.us-east-2.elb.amazonaws.com"

          # Test via ALB directly with Host header
          echo "📡 Testing via ALB direct..."
          HEALTH_STATUS=$(curl -sk https://${ALB_DNS}/health/live -H "Host: app.tmsinstitute.co" 2>&1) || {
            echo "❌ CRITICAL: Production liveness check failed!"
            echo "Response: $HEALTH_STATUS"
            exit 1
          }
          echo "✅ Liveness (ALB direct): $HEALTH_STATUS"

          HEALTH_RESPONSE=$(curl -sk https://${ALB_DNS}/health -H "Host: app.tmsinstitute.co" 2>&1) || {
            echo "❌ CRITICAL: Production health check failed!"
            echo "Response: $HEALTH_RESPONSE"
            exit 1
          }
          echo "✅ Health (ALB direct): $HEALTH_RESPONSE"

          # Test via custom domain (non-blocking)
          echo ""
          echo "📡 Testing via custom domain..."
          DOMAIN_STATUS=$(curl -sf ${{ env.PRODUCTION_URL }}/health/live 2>&1) && {
            echo "✅ Custom domain reachable: $DOMAIN_STATUS"
          } || {
            echo "⚠️  Custom domain not yet reachable"
          }

          echo ""
          echo "🎉 All production smoke tests passed!"

      # --- Post-deploy Identity Verification ---
      - name: "🔐 Post-deploy: verify live frontend is NeuroReach"
        run: |
          URL="${{ env.PRODUCTION_URL }}"
          echo "🔎 Fetching $URL and checking <title>..."
          for i in 1 2 3 4 5 6; do
            HTML=$(curl -s --max-time 10 "$URL/" || true)
            TITLE=$(echo "$HTML" | grep -oiE '<title>[^<]*</title>' | head -n1 || echo '')
            if echo "$TITLE" | grep -iq 'NeuroReach'; then
              echo "✅ Live frontend title OK: $TITLE"
              if echo "$HTML" | grep -iq 'SleepReach\|sleeplessinarizona'; then
                echo "❌ CRITICAL: live HTML contains forbidden markers!"
                echo "$HTML" | grep -iE 'SleepReach\|sleeplessinarizona' | head -5
                exit 1
              fi
              echo "✅ No cross-contamination markers in live HTML."
              exit 0
            fi
            echo "⏳ Attempt $i/6: title was '$TITLE' — waiting 10s for ALB to cut over..."
            sleep 10
          done
          echo "❌ CRITICAL: $URL is NOT serving NeuroReach — contamination detected."
          echo "   Last title seen: $TITLE"
          echo "   First 500 bytes of HTML:"
          echo "$HTML" | head -c 500
          exit 1

      # --- Git Release Tag ---
      - name: Create git release tag
        run: |
          SHA=${{ steps.deploy-info.outputs.sha_short }}
          TAG="deploy-prod-${SHA}-$(date -u +%Y%m%d-%H%M%S)"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Production deployment: ${SHA}

          Deployed by: ${{ github.actor }}
          Image: ${{ steps.image-tag.outputs.full_image }}
          Workflow: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          git push origin "$TAG"
          echo "✅ Tagged: $TAG"

      # --- Deployment Summary ---
      - name: Deployment summary
        if: always()
        run: |
          echo "## 🚀 Production Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Detail | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| **Environment** | Production |" >> $GITHUB_STEP_SUMMARY
          echo "| **URL** | ${{ env.PRODUCTION_URL }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Image** | \`${{ steps.image-tag.outputs.tag }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Commit** | \`${{ steps.deploy-info.outputs.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Branch** | main |" >> $GITHUB_STEP_SUMMARY
          echo "| **Actor** | ${{ github.actor }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Cluster** | ${{ env.ECS_CLUSTER }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Backend Service** | ${{ env.ECS_SERVICE_BACKEND }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Celery Service** | ${{ env.ECS_SERVICE_CELERY }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Frontend Service** | ${{ env.ECS_SERVICE_FRONTEND }} |" >> $GITHUB_STEP_SUMMARY

  # ===========================================================================
  # Notify
  # ===========================================================================
  notify:
    name: "📧 Notify"
    runs-on: ubuntu-latest
    needs: [ build-and-deploy ]
    if: always()
    steps:
      - name: Notify on success
        if: needs.build-and-deploy.result == 'success'
        run: |
          echo "✅ PRODUCTION deployment successful!"
          echo "Image: ${{ needs.build-and-deploy.outputs.image_tag }}"
          echo "Commit: ${{ needs.build-and-deploy.outputs.deploy_sha }}"
          echo "URL: https://app.tmsinstitute.co"
          echo "Deployed by: ${{ github.actor }}"

      - name: Notify on failure
        if: needs.build-and-deploy.result == 'failure'
        run: |
          echo "🚨 PRODUCTION deployment FAILED!"
          echo "Commit: ${{ needs.build-and-deploy.outputs.deploy_sha }}"
          echo "Actor: ${{ github.actor }}"
          echo "Check logs: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          echo ""
          echo "⚠️ IMMEDIATE ACTION REQUIRED: Check production health at ${{ env.PRODUCTION_URL }}/health"
