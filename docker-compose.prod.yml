# =============================================================================
# NeuroReach AI — Docker Compose (Production)
# =============================================================================
# Usage:
#   docker compose -f docker-compose.prod.yml up -d
#
# This file is for LOCAL production simulation or self-hosted deploys.
# AWS ECS uses task definitions (not compose) — see .github/workflows/.
#
# Differences from dev:
#   - No maildev, smsdev, flower, elasticsearch
#   - No source volume mounts (uses baked-in image code)
#   - Pinned image tags (set via CI/CD)
#   - Proper restart policies
#   - Network isolation (frontend, backend, data tiers)
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL Database
  # ---------------------------------------------------------------------------
  db:
    image: postgres:14.15-alpine
    container_name: neuroreach-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-neuroreach}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
    command: >
      postgres
      -c shared_buffers=512MB
      -c effective_cache_size=1536MB
      -c work_mem=16MB
      -c maintenance_work_mem=256MB
      -c random_page_cost=1.1
      -c effective_io_concurrency=200
      -c min_wal_size=1GB
      -c max_wal_size=4GB
      -c checkpoint_completion_target=0.9
      -c wal_buffers=64MB
      -c max_connections=200
      -c idle_in_transaction_session_timeout=30000
      -c statement_timeout=30000
      -c log_min_duration_statement=200
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB:-neuroreach}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - data
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G

  # ---------------------------------------------------------------------------
  # Redis Cache (non-cluster, single node)
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7.4-alpine
    container_name: neuroreach-redis
    restart: always
    volumes:
      - redis_data:/data
    command: >
      redis-server
      --appendonly yes
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --tcp-keepalive 300
      --save 900 1
      --save 300 10
      --save 60 10000
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - data
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 768M

  # ---------------------------------------------------------------------------
  # FastAPI Backend (production image — no volume mounts)
  # ---------------------------------------------------------------------------
  backend:
    image: ${ECR_REGISTRY:-neuroreach-ai}/backend:${IMAGE_TAG:-latest}
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    container_name: neuroreach-backend
    restart: always
    env_file:
      - ./backend/.env.production
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-neuroreach}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      - ENVIRONMENT=production
      - WEB_CONCURRENCY=${WEB_CONCURRENCY:-4}
      - PYTHONUNBUFFERED=1
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - data
      - backend
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1G

  # ---------------------------------------------------------------------------
  # React Frontend (nginx serving static build)
  # ---------------------------------------------------------------------------
  frontend:
    image: ${ECR_REGISTRY:-neuroreach-ai}/frontend:${IMAGE_TAG:-latest}
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
    container_name: neuroreach-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - frontend
      - backend
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 256M

  # ---------------------------------------------------------------------------
  # Celery Worker (production — async tasks)
  # ---------------------------------------------------------------------------
  celery-worker:
    image: ${ECR_REGISTRY:-neuroreach-ai}/backend:${IMAGE_TAG:-latest}
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    container_name: neuroreach-celery-worker
    restart: always
    command: celery -A src.tasks.celery_app worker --loglevel=info --concurrency=${CELERY_WORKER_CONCURRENCY:-10}
    env_file:
      - ./backend/.env.production
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-neuroreach}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      - ENVIRONMENT=production
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A src.tasks.celery_app inspect ping --timeout 10 2>&1 | grep -q pong"]
      interval: 60s
      timeout: 30s
      retries: 5
      start_period: 60s
    networks:
      - data
      - backend
    deploy:
      resources:
        limits:
          memory: 1G

  # ---------------------------------------------------------------------------
  # Celery Beat (production — scheduled tasks)
  # ---------------------------------------------------------------------------
  celery-beat:
    image: ${ECR_REGISTRY:-neuroreach-ai}/backend:${IMAGE_TAG:-latest}
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    container_name: neuroreach-celery-beat
    restart: always
    command: celery -A src.tasks.celery_app beat --loglevel=info --schedule=/var/run/celery/celerybeat-schedule
    env_file:
      - ./backend/.env.production
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-neuroreach}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      - ENVIRONMENT=production
    volumes:
      - celerybeat_schedule:/var/run/celery
    depends_on:
      - celery-worker
    healthcheck:
      test: ["CMD-SHELL", "test -f /var/run/celery/celerybeat-schedule || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - data
    deploy:
      resources:
        limits:
          memory: 256M

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  celerybeat_schedule:
    driver: local

networks:
  frontend:
    name: neuroreach-frontend
  backend:
    name: neuroreach-backend
  data:
    name: neuroreach-data
